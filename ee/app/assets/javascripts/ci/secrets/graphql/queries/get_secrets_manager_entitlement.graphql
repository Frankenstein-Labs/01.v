# @feature_category: secrets_management
query getSecretsManagerEntitlement($fullPath: ID!) {
  # must be a top-level group namespace
  group(fullPath: $fullPath) {
    id
    secretsManagerEntitlement {
      state
      blockedReason
      trialStartedAt
      trialExpiresAt
      creditsRemaining
      creditsTotal
      onDemandEnabled
    }
  }
}
