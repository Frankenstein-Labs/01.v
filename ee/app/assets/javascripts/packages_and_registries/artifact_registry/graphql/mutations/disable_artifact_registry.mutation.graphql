# @feature_category: artifact_registry

# Entirely @client: the Artifact Registry disable mutation does not exist in the schema
# yet, so graphql-verify reports this document as a client query and skips it. Removing
# the directive is the only change needed once the backend lands.
mutation disableArtifactRegistry($input: LocalArtifactRegistryDisableInput!) {
  disableRegistry: artifactRegistryDisable(input: $input) @client {
    errors
  }
}
