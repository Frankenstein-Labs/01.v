---
title: Merge request analytics
description: Get insights into your merge request lifecycle and view trends over time.
filters:
  dateRange:
    enabled: true
    defaultOption: 365d
    options:
    - 7d
    - 30d
    - 90d
    - 180d
    - 365d
    - custom
    numberOfDaysLimit: 365
  filteredSearch:
    enabled: true
    options:
    - token: source_branch
    - token: target_branch
    - token: milestone
    - token: label
    - token: author
      operator: is
    - token: assignee
      operator: is
      unique: true
panels:
- title: Mean time to merge
  visualization:
    type: SingleStat
    data:
      type: mean_time_to_merge
      query:
        dateRange: 365d
    options:
      unit: days
      decimalPlaces: 0
  gridAttributes:
    width: 3
    height: 1
    yPos: 0
    xPos: 0
  queryOverrides: {}
- title: Throughput
  visualization:
    type: AreaChart
    data:
      type: merge_request_counts
      query:
        dateRange: 365d
    options:
      xAxis:
        name: Month
        type: category
      yAxis:
        name: Merge Requests merged
        type: value
      chartTooltip:
        valueUnit: COUNT
  gridAttributes:
    width: 12
    height: 4
    yPos: 1
    xPos: 0
  queryOverrides: {}
- title: Merge Requests
  visualization:
    type: DataTable
    data:
      type: merge_requests
      query:
        dateRange: 365d
    options:
      responsive: false
      fixed: true
      stacked: md
      fields:
      - key: link
        label: Merge Request
        component: MergeRequestLink
        thClass: gl-w-1/4
      - key: dateMerged
        label: Date Merged
        thClass: gl-w-1/8
        component: FormatTime
      - key: timeToMerge
        label: Time to merge
        component: FormatTimeRange
      - key: milestone
        label: Milestone
        component: MilestoneLink
      - key: commitCount
        label: Commits
      - key: pipelinesCount
        label: Pipelines
      - key: diffStatsSummary
        label: Line changes
        component: DiffLineChanges
        thClass: gl-w-1/8
      - key: assignees
        label: Assignees
        component: AssigneeAvatars
        thClass: gl-w-1/8
  gridAttributes:
    width: 12
    height: 13
    yPos: 2
    xPos: 4
  queryOverrides: {}
